        <h1 style="color:#fff">주식 가계부</h1>
        <p>
          증권사 앱이 알려주지 않는 <b style="color:#fff">내 돈 기준 진짜 수익률</b>을 계산하는 2인 공유 배당 투자 장부입니다.
          배당 재투자와 리밸런싱 실현차익을 뺀 순수 투자원금 기준으로 수익률을 계산합니다.
        </p>
        <p>
          증권사 앱은 배당으로 다시 산 주식과 리밸런싱으로 실현한 차익까지 <b style="color:#fff">투자원금에 더합니다.</b>
          내 통장에서 나간 돈은 그대로인데 원금만 불어나니, 수익률 계산의 분모가 커져 실제보다 낮게 보입니다.
          성실하게 재투자한 사람일수록 성과가 깎여 보이는 구조입니다.
        </p>
        <p>
          이 서비스는 월말 잔고만 옮겨 적으면 그 왜곡을 걷어낸 수익률을 계산합니다.
          <b style="color:#fff">순수 투자원금 = 총 투자원금 − 배당 재투자액 − 리밸런싱 실현차익</b>,
          <b style="color:#fff">진짜 수익률 = 평가액 ÷ 순수 투자원금 − 1</b>. 무료이고 구글 로그인 하나로 시작합니다.
        </p>
